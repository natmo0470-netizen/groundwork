<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Movla Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css">
<style>
  body { background: var(--bg); }
  .adm { max-width: 1120px; margin: 0 auto; padding: 16px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
  .adm-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .adm-top .brand { display: flex; align-items: center; gap: 10px; font: 700 22px/1 var(--font-display); letter-spacing: .02em; }
  .adm-top .brand img { width: 28px; height: 28px; border-radius: 8px; }
  .adm-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
  .adm-tabs::-webkit-scrollbar { display: none; }
  .adm-tabs button { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 8px 14px; font: 600 14px var(--font-body); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .adm-tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .adm-tabs .count { background: var(--bad); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 11.5px; line-height: 17px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .kpi .k { font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
  .kpi .v { font: 700 30px/1.05 var(--font-display); font-variant-numeric: tabular-nums; color: var(--ink); }
  .kpi .d { font-size: 12.5px; color: var(--ink-2); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .chart { position: relative; }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart .axis { fill: var(--ink-3); font: 600 11px var(--font-body); }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .bar { fill: var(--train); }
  .chart .bar.dim { fill: color-mix(in srgb, var(--train) 45%, var(--surface)); }
  .chart .ln { fill: none; stroke: var(--train); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .area { fill: color-mix(in srgb, var(--train) 12%, transparent); }
  .chart .dot { fill: var(--train); stroke: var(--surface); stroke-width: 2; }
  .chart .hit { fill: transparent; cursor: crosshair; }
  .chart .cross { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 6px 9px; font-size: 12.5px; font-weight: 600; white-space: nowrap; transform: translate(-50%, -110%); z-index: 3; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tbl th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tbl tr:last-child td { border-bottom: 0; }
  .scrollx { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn.xs { min-height: 32px; padding: 0 10px; font-size: 13px; border-radius: 9px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
  .pill.ok { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .pill.plain { background: var(--surface-2); color: var(--ink-2); }
  .dotst { width: 9px; height: 9px; border-radius: 50%; background: currentColor; display: inline-block; }
  .muted { color: var(--ink-2); }
  .faint { color: var(--ink-3); }
  .fb { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-top: 1px solid var(--line); }
  .fb:first-child { border-top: 0; padding-top: 0; }
  .fb p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bar-meter { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .bar-meter i { display: block; height: 100%; background: var(--train); border-radius: 999px; }
  .inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
  .inline-form .field { min-width: 140px; flex: 1; }
  .login { max-width: 380px; margin: 10vh auto 0; }
  select.input, input.input { min-height: 42px; }
  .err { color: var(--bad); font-size: 13.5px; margin: 0; }
  .center { text-align: center; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div id="root" class="adm"><p class="muted">Loading…</p></div>
<script src="js/cloud-config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
