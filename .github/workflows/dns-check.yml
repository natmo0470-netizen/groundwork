# Shows what public DNS currently returns for movla.app's mail records (run from Actions when debugging email setup).
name: DNS check
on: workflow_dispatch
jobs:
  dig:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in "send.movla.app CNAME" "rsend.movla.app CNAME" "send.movla.app ANY" "resend._domainkey.movla.app TXT" "movla.app MX" "movla.app TXT" "_dmarc.movla.app TXT"; do
            set -- $q
            for r in 1.1.1.1 dns1.registrar-servers.com; do
              if [ "$2" = ANY ]; then a=$(dig +noall +answer @$r $1 ANY | awk '{print $4" "$5}' | tr '\n' ' ' | cut -c1-180); else a=$(dig +short @$r $1 $2 | tr '\n' ' ' | cut -c1-120); fi
              echo "::notice title=$1 $2 @ $r::${a:-(none)}"
            done
          done
