# Builds a test APK in GitHub's cloud. Run it from the Actions tab ("Run workflow"),
# then download "groundwork-test-apk" from the finished run.
name: Build Android test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build:web
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#111A17' --splashBackgroundColor '#F3F5F4'
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: groundwork-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
